services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: online-class:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/app.db
      SEED: "1"
      # 演示"教学时钟"时改这里；生产应为 0。
      TEACHING_CLOCK_OFFSET: "0"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  app-data:
